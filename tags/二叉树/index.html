<script>
  function secondToDate(second) {
    if (!second) { return 0; }
    var time = new Array(0, 0, 0, 0, 0);
    if (second >= 365 * 24 * 3600) { time[0] = parseInt(second / (365 * 24 * 3600)); second %= 365 * 24 * 3600; }
    if (second >= 24 * 3600) { time[1] = parseInt(second / (24 * 3600)); second %= 24 * 3600; }
    if (second >= 3600) { time[2] = parseInt(second / 3600); second %= 3600; }
    if (second >= 60) { time[3] = parseInt(second / 60); second %= 60; }
    if (second > 0) { time[4] = second; }
    return time;
  }
  function prestuSetTime() {
    var create_time = Math.round(new Date(Date.UTC(2019, 0, 1, 0, 0, 0)).getTime() / 1000);
    var timestamp = Math.round((new Date().getTime() + 8 * 60 * 60 * 1000) / 1000);
    var currentTime = secondToDate((timestamp - create_time));
    var html = '已经运行了：' + currentTime[0] + '年' + currentTime[1] + '天' + currentTime[2] + '时' + currentTime[3] + '分' + currentTime[4] + '秒';
    var el = document.getElementById('htmer_time');
    if (el) { el.innerHTML = html; }
  }
  function prestuClock() {
    var el = document.getElementById('jnkc');
    if (el) { el.innerHTML = new Date().toLocaleString() + ' 星期' + '日一二三四五六'.charAt(new Date().getDay()); }
  }
  setInterval(prestuSetTime, 1000);
  setInterval(prestuClock, 1000);
  prestuSetTime();
  prestuClock();
</script>
